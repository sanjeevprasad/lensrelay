name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        LensRelay is pre-alpha. Please search existing issues and avoid attaching private camera footage or credentials.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Start ...
        2. Connect ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Android device and version
      placeholder: Pixel 7, Android 15
  - type: input
    id: desktop
    attributes:
      label: Desktop operating system
      placeholder: Windows 11 24H2 or Fedora 42
  - type: textarea
    id: diagnostics
    attributes:
      label: Relevant diagnostics
      description: Remove IP addresses, pairing data, credentials, and personal information.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues.
          required: true
        - label: I removed sensitive and personal data.
          required: true
