[package]
name        = "lensrelay-desktop"
version     = "0.1.0"
description = "LensRelay desktop receiver"
authors     = ["Sanjeev Prasad <this.sanjeevprasad@gmail.com>"]
license     = "Apache-2.0"
edition     = "2021"

[lib]
name       = "lensrelay_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64         = "0.23.1"
directories    = "6.0.0"
ed25519-dalek  = "3.0.0"
getrandom      = "0.4.3"
qrcode         = { version = "0.14.1", default-features = false, features = ["svg"] }
rcgen          = "0.14.9"
p256           = { version = "0.14", features = ["ecdsa", "pkcs8"] }
moq-relay      = { version = "0.14.11", default-features = false, features = ["quinn", "websocket"] }
serde          = { version = "1", features = ["derive"] }
serde_json     = "1"
sha2           = "0.11.0"
tauri          = { version = "2", features = [] }
tokio          = { version = "1", features = ["rt-multi-thread"] }
rustls         = "0.23"
rustls-pemfile = "2"

[target.'cfg(target_os = "linux")'.dependencies]
gstreamer     = "0.25.2"
gstreamer-app = "0.25.2"
